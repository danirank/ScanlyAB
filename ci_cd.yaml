trigger:
  branches:
    include:
      - main
 
variables:
  projectPath: '$(Build.SourcesDirectory)/ScanlyApi/ScanlyApi.csproj'

  serviceConnection: 'scanly-connection'
  resourceGroup: 'RG-Daniel-Rank-64f115-DotNetCloudDeveloper-VT-Mars-Goteborg'

  acrName: 'scanlystageacr'
  imageName: 'scanlyapi'
  imageTag: '$(Build.BuildId)'

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

#############
# Build .Net
#############

  - task: UseDotNet@2
    displayName: Use .NET SDK
    inputs:
      packageType: sdk
      version: '10.x'

  - script: dotnet restore "$(projectPath)"
    displayName: Restore

  - script: dotnet build "$(projectPath)" --configuration Release --no-restore
    displayName: Build



#########
#Build and push Image to ACR
#########


  - task: AzureCLI@2
    displayName: Build and push image to ACR
    inputs:
      azureSubscription: '$(serviceConnection)'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        # Login mot ACR
        az acr login --name $(acrName)

        # Build image
        docker build \
          -t $(acrName).azurecr.io/$(imageName):$(imageTag) \
          ScanlyApi/

        # Push image
        docker push \
          $(acrName).azurecr.io/$(imageName):$(imageTag)

#########
#Update Container App
#########

  - task: AzureCLI@2
    displayName: Update Container App
    inputs:
      azureSubscription: '$(serviceConnection)'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az containerapp update \
          --name scanly-stage-api \
          --resource-group $(resourceGroup) \
          --image $(acrName).azurecr.io/$(imageName):$(imageTag)

  - task: AzureCLI@2
    displayName: Health check
    inputs:
      azureSubscription: '$(serviceConnection)'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        # Get the URL of the Container App
        CONTAINER_APP_URL=$(az containerapp show \
          --name scanly-stage-api \
          --resource-group $(resourceGroup) \
          --query properties.configuration.ingress.fqdn \
          --output tsv)

        # Perform health check
        echo "Running health check..."
        curl --fail \
          --retry 5 \
          --retry-delay 5 \
          "https://${CONTAINER_APP_URL}/health"